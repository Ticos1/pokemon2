<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Jornada por Kanto</title>
  <meta name="description" content="Jogo de fã com gráficos do FireRed: o treinador anda sozinho por Kanto e as batalhas acontecem em tempo real.">
  <meta name="theme-color" content="#202848">
  <meta property="og:title" content="Pokémon: Jornada por Kanto">
  <meta property="og:description" content="O treinador anda sozinho por Kanto: 8 ginásios, Elite dos 4 e batalhas em tempo real.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23f04040' stroke='%23222'/%3E%3Cpath d='M1 8h14v1a7 7 0 0 1-14 0z' fill='%23fff'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%23fff' stroke='%23222'/%3E%3C/svg%3E">
</head>
<body>
  <div id="stage">
    <canvas id="screen" width="360" height="640"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-row">
        <span id="step" class="step">0/15</span>
        <div id="prog"></div>
      </div>
      <div class="hud-row">
        <span class="stat"><span class="ico" style="background-position:0 0"></span><b id="balls">0</b></span>
        <span class="stat"><span class="ico" style="background-position:-54px 0"></span><b id="potions">0</b></span>
        <span class="stat money" id="money">₽0</span>
        <span class="hud-buttons">
          <button id="btn-speed" title="Velocidade">1x</button>
          <button id="btn-auto" title="Avançar textos sozinho">AUTO</button>
          <button id="btn-mute" title="Som">♪</button>
        </span>
      </div>
    </div>

    <div id="party" class="hidden"></div>
    <div id="battle-buttons" class="hidden"></div>

    <div id="dialog" class="hidden"><div class="text"></div><div class="arrow">▼</div></div>
    <div id="choices" class="hidden"></div>
    <div id="modal" class="modal hidden"></div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/gba.js"></script>
  <script src="assets/moves.js"></script>
  <script src="js/moves.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/mon.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/save.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/world.js"></script>
  <script src="js/game.js"></script>
  <script src="js/events.js"></script>
  <script>
    // no GitHub Pages (https) o jogo funciona offline e pode ser instalado no celular
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
