# Roda os testes (node tools/test.js) a cada push e pull request
name: Testes
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test.js
      - run: node tools/sim.js 20 1
